name: Execute rental statistics notebook
on:
  push:
    paths:
      - 'projects/rental-market-statistics/rental_market_analysis.ipynb'
      - 'projects/rental-market-statistics/rental_clean_data.csv'
      - '.github/workflows/execute-rental.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r projects/rental-market-statistics/requirements.txt nbconvert ipykernel
      - name: Execute and save notebook outputs
        working-directory: projects/rental-market-statistics
        run: |
          jupyter nbconvert --to notebook --execute --inplace rental_market_analysis.ipynb --ExecutePreprocessor.timeout=600
      - name: Commit rendered notebook
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/rental-market-statistics/rental_market_analysis.ipynb
          git diff --cached --quiet || (git commit -m "Save rental statistics outputs and plots" && git push)
